<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0d0f12;
    --surface:  #141720;
    --surface2: #1c2030;
    --border:   #2a2f3f;
    --accent:   #3dd68c;
    --accent2:  #6eb3f7;
    --tool:     #f0a050;
    --muted:    #4a5068;
    --text:     #c8d0e0;
    --text2:    #8892a4;
    --danger:   #f05070;
    --mono:     'JetBrains Mono', monospace;
    --sans:     'Syne', sans-serif;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 14px; line-height: 1.6; }

  /* Auth screen */
  .auth-screen {
    display: flex; align-items: center; justify-content: center;
    height: 100vh; background: var(--bg);
  }
  .auth-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 40px; width: 360px;
  }
  .auth-logo { font-family: var(--sans); font-size: 22px; font-weight: 800; color: var(--accent); margin-bottom: 8px; }
  .auth-logo span { color: var(--text2); font-weight: 400; }
  .auth-sub { color: var(--text2); font-size: 12px; margin-bottom: 28px; }
  .auth-tabs { display: flex; gap: 0; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
  .auth-tab {
    padding: 8px 20px; font-family: var(--mono); font-size: 12px;
    cursor: pointer; color: var(--text2); border-bottom: 2px solid transparent;
    margin-bottom: -1px; background: none; border-top: none; border-left: none; border-right: none;
  }
  .auth-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .auth-field { margin-bottom: 14px; }
  .auth-field label { display: block; font-size: 11px; color: var(--text2); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
  .auth-field input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-family: var(--mono); font-size: 13px;
    padding: 9px 12px; border-radius: 6px; outline: none;
  }
  .auth-field input:focus { border-color: var(--accent); }
  .auth-btn {
    width: 100%; padding: 10px; background: var(--accent); color: #0d1117;
    border: none; border-radius: 6px; font-family: var(--mono); font-size: 13px;
    font-weight: 500; cursor: pointer; margin-top: 8px;
  }
  .auth-btn:hover { opacity: 0.9; }
  .auth-guest { text-align: center; margin-top: 16px; font-size: 11px; color: var(--text2); }
  .auth-guest a { color: var(--accent2); cursor: pointer; text-decoration: none; }
  .auth-error { color: var(--danger); font-size: 11px; margin-top: 8px; min-height: 16px; }

  /* App shell */
  .shell {
    display: grid; grid-template-columns: 260px 1fr;
    grid-template-rows: 48px 1fr; height: 100vh; overflow: hidden;
  }

  /* Topbar */
  .topbar {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 12px;
    padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--border);
    user-select: none;
  }
  .topbar-logo { font-family: var(--sans); font-weight: 800; font-size: 16px; color: var(--accent); letter-spacing: -0.5px; }
  .topbar-logo span { color: var(--text2); font-weight: 400; }
  .repo-selector {
    margin-left: 16px; display: flex; align-items: center; gap: 6px;
  }
  .repo-selector input {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-family: var(--mono); font-size: 11px;
    padding: 4px 8px; border-radius: 4px; outline: none; width: 180px;
  }
  .repo-selector input:focus { border-color: var(--accent); }
  .repo-branch {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text2); font-family: var(--mono); font-size: 11px;
    padding: 4px 8px; border-radius: 4px; outline: none; width: 90px;
  }
  .repo-branch:focus { border-color: var(--accent); color: var(--text); }
  .repo-label { font-size: 10px; color: var(--muted); }
  .topbar-status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text2); }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); transition: background 0.4s; }
  .status-dot.ready { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .status-dot.thinking { background: var(--tool); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }
  .topbar-user { font-size: 11px; color: var(--text2); display: flex; align-items: center; gap: 8px; margin-left: 12px; }
  .topbar-user span { color: var(--accent); }
  .btn-logout { font-size: 10px; color: var(--muted); cursor: pointer; padding: 2px 6px; border: 1px solid var(--border); border-radius: 4px; background: none; font-family: var(--mono); }
  .btn-logout:hover { color: var(--danger); border-color: var(--danger); }

  /* Sidebar */
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .sidebar-section { padding: 12px 16px 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .sessions { flex: 1; overflow-y: auto; padding: 4px 8px; }
  .session-item {
    padding: 8px 10px; border-radius: 6px; cursor: pointer;
    font-size: 12px; color: var(--text2); margin-bottom: 2px;
  }
  .session-item:hover { background: var(--surface2); color: var(--text); }
  .session-item.active { background: var(--surface2); color: var(--accent); }
  .session-date { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .btn-new-session {
    margin: 8px; padding: 7px 12px; background: none;
    border: 1px dashed var(--border); border-radius: 6px;
    color: var(--text2); font-family: var(--mono); font-size: 12px; cursor: pointer;
  }
  .btn-new-session:hover { border-color: var(--accent); color: var(--accent); }
  .btn-new-session::before { content: '+ '; color: var(--accent); }
  .memory-section { border-top: 1px solid var(--border); padding-bottom: 8px; flex-shrink: 0; }
  .memory-list { max-height: 160px; overflow-y: auto; padding: 4px 8px; }
  .memory-item { font-size: 11px; color: var(--text2); padding: 4px 8px; border-left: 2px solid var(--accent); margin: 3px 0; opacity: 0.8; }
  .memory-empty { font-size: 11px; color: var(--muted); padding: 8px; }
  .btn-clear-memory {
    margin: 4px 8px; padding: 5px 10px; background: none;
    border: 1px solid var(--border); border-radius: 4px;
    color: var(--text2); font-family: var(--mono); font-size: 11px; cursor: pointer; width: calc(100% - 16px);
  }
  .btn-clear-memory:hover { border-color: var(--danger); color: var(--danger); }

  /* Chat */
  .chat-area { display: flex; flex-direction: column; overflow: hidden; }
  .messages { flex: 1; overflow-y: auto; padding: 24px 32px; display: flex; flex-direction: column; gap: 20px; }
  .welcome { text-align: center; margin: auto; max-width: 500px; padding: 40px 0; }
  .welcome-title { font-family: var(--sans); font-size: 36px; font-weight: 800; color: var(--text); margin-bottom: 8px; }
  .welcome-title span { color: var(--accent); }
  .welcome-sub { color: var(--text2); margin-bottom: 28px; font-size: 13px; }
  .welcome-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip { padding: 6px 14px; border: 1px solid var(--border); border-radius: 20px; font-size: 12px; color: var(--text2); cursor: pointer; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  /* Messages */
  .msg { display: flex; flex-direction: column; gap: 4px; }
  .msg-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .msg.user .msg-label { color: var(--accent2); }
  .msg-bubble { padding: 12px 16px; border-radius: 8px; max-width: 820px; line-height: 1.7; }
  .msg.user .msg-bubble { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
  .msg.assistant .msg-bubble { color: var(--text); }
  .msg-bubble code { background: var(--surface2); border: 1px solid var(--border); padding: 1px 5px; border-radius: 3px; font-size: 12px; color: var(--accent2); }
  .msg-bubble pre { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; overflow-x: auto; margin: 8px 0; }
  .msg-bubble pre code { background: none; border: none; padding: 0; color: var(--text); }
  .msg-bubble h2 { font-size: 1.05em; font-weight: 700; color: var(--accent2); margin: 12px 0 4px; }
  .msg-bubble h3 { font-size: 1em; font-weight: 600; color: var(--accent2); margin: 10px 0 4px; }
  .msg-bubble h4 { font-size: 0.95em; font-weight: 600; color: var(--text); margin: 8px 0 4px; }
  .msg-bubble ul { list-style: none; padding: 0; margin: 6px 0; }
  .msg-bubble ul li::before { content: '▸ '; color: var(--accent); }
  .msg-bubble ul li { margin: 2px 0; }
  .msg-bubble hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  .msg-bubble strong { color: var(--text); }
  .msg-bubble em { color: var(--text2); font-style: italic; }

  /* Tool traces */
  .trace-block { border: 1px solid var(--border); border-radius: 6px; margin: 6px 0; overflow: hidden; }
  .trace-header {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px;
    background: var(--surface2); cursor: pointer; user-select: none; font-size: 12px;
  }
  .trace-header:hover { background: var(--border); }
  .trace-icon { color: var(--tool); font-size: 13px; }
  .trace-name { color: var(--tool); font-weight: 500; }
  .trace-status { margin-left: auto; font-size: 10px; color: var(--muted); }
  .trace-status.done { color: var(--accent); }
  .trace-chevron { color: var(--muted); font-size: 10px; transition: transform 0.2s; margin-left: 4px; }
  .trace-block.open .trace-chevron { transform: rotate(90deg); }
  .trace-body { display: none; padding: 10px 14px; font-size: 12px; color: var(--text2); border-top: 1px solid var(--border); }
  .trace-block.open .trace-body { display: block; }

  /* Cursor blink */
  .cursor::after { content: '▋'; color: var(--accent); animation: blink 0.8s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Input bar */
  .input-bar { padding: 16px 32px 20px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
  .input-row { display: flex; align-items: flex-end; gap: 10px; }
  .input-wrap { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: flex-end; padding: 4px; }
  .input-wrap:focus-within { border-color: var(--accent); }
  textarea#user-input {
    flex: 1; background: none; border: none; outline: none; resize: none;
    color: var(--text); font-family: var(--mono); font-size: 13px;
    padding: 8px 10px; line-height: 1.5; max-height: 160px; min-height: 40px;
  }
  textarea#user-input::placeholder { color: var(--muted); }
  .send-btn {
    width: 38px; height: 38px; border-radius: 6px; background: var(--accent);
    border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .send-btn svg { width: 16px; height: 16px; fill: #0d1117; }
  .input-hint { font-size: 11px; color: var(--muted); }
  .input-hint kbd { background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 1px 5px; font-family: var(--mono); font-size: 10px; }
</style>
</head>
<body>

<!-- Auth screen -->
<div class="auth-screen" id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">gh<span>agent</span></div>
    <div class="auth-sub">Sign in to start managing your repos with AI</div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuthTab('login')">Sign in</button>
      <button class="auth-tab" onclick="switchAuthTab('register')">Register</button>
    </div>
    <div class="auth-field">
      <label>Username</label>
      <input type="text" id="auth-username" placeholder="your-username" autocomplete="username">
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="auth-error" id="auth-error"></div>
    <button class="auth-btn" id="auth-submit-btn" onclick="submitAuth()">Sign in</button>
    <div class="auth-guest">
      <a onclick="continueAsGuest()">Continue without account</a>
    </div>
  </div>
</div>

<!-- App shell (hidden until authed) -->
<div class="shell" id="app-shell" style="display:none">

  <div class="topbar">
    <div class="topbar-logo">gh<span>agent</span></div>
    <div class="repo-selector">
      <span class="repo-label">repo:</span>
      <input type="text" id="active-repo" placeholder="owner/repo" title="Active repository (optional)">
      <span class="repo-label">branch:</span>
      <input type="text" id="active-branch" class="repo-branch" placeholder="main" title="Active branch">
    </div>
    <div class="topbar-status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">connecting…</span>
    </div>
    <div class="topbar-user">
      logged in as <span id="topbar-username"></span>
      <button class="btn-logout" onclick="logout()">logout</button>
    </div>
  </div>

  <aside class="sidebar">
    <div class="sidebar-section">Sessions</div>
    <button class="btn-new-session" onclick="newSession()">new session</button>
    <div class="sessions" id="session-list"></div>
    <div class="memory-section">
      <div class="sidebar-section">Long-term memory</div>
      <div class="memory-list" id="memory-list">
        <div class="memory-empty">no memories yet</div>
      </div>
      <button class="btn-clear-memory" onclick="clearMemory()">clear memory</button>
    </div>
  </aside>

  <div class="chat-area">
    <div class="messages" id="messages"></div>
    <div class="input-bar">
      <div class="input-row">
        <div class="input-wrap">
          <textarea id="user-input" rows="1" placeholder="Ask the agent anything about your repos…" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        </div>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
        </button>
      </div>
      <div class="input-hint"><kbd>Enter</kbd> to send &nbsp;·&nbsp; <kbd>Shift+Enter</kbd> for newline</div>
    </div>
  </div>

</div>

<script>
const API = 'http://localhost:8000';

// Auth state
let authToken = localStorage.getItem('gh-agent-token') || null;
let currentUsername = localStorage.getItem('gh-agent-username') || null;
let authMode = 'login';

function switchAuthTab(mode) {
  authMode = mode;
  document.querySelectorAll('.auth-tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && mode === 'login') || (i === 1 && mode === 'register'));
  });
  document.getElementById('auth-submit-btn').textContent = mode === 'login' ? 'Sign in' : 'Create account';
  document.getElementById('auth-error').textContent = '';
}

async function submitAuth() {
  const username = document.getElementById('auth-username').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  if (!username || !password) { errEl.textContent = 'Username and password required.'; return; }

  const endpoint = authMode === 'login' ? '/auth/login' : '/auth/register';
  try {
    const r = await fetch(API + endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const d = await r.json();
    if (!r.ok) { errEl.textContent = d.detail || 'Authentication failed.'; return; }
    setAuth(d.access_token, d.username);
  } catch (e) {
    errEl.textContent = 'Server unreachable.';
  }
}

function setAuth(token, username) {
  authToken = token;
  currentUsername = username;
  localStorage.setItem('gh-agent-token', token);
  localStorage.setItem('gh-agent-username', username);
  showApp();
}

function continueAsGuest() {
  authToken = null;
  currentUsername = 'guest';
  showApp();
}

function logout() {
  authToken = null;
  currentUsername = null;
  localStorage.removeItem('gh-agent-token');
  localStorage.removeItem('gh-agent-username');
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('app-shell').style.display = 'none';
  document.getElementById('auth-password').value = '';
  document.getElementById('auth-error').textContent = '';
}

function showApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app-shell').style.display = 'grid';
  document.getElementById('topbar-username').textContent = currentUsername || 'guest';
  checkHealth();
  renderSessions();
  loadMemories();
}

// Sessions
let sessions = JSON.parse(localStorage.getItem('gh-agent-sessions') || '[]');
let activeSession = null;

// Auto-login if token exists
if (authToken) {
  showApp();
}

function newSession() {
  const id = crypto.randomUUID();
  const session = { id, label: 'Session ' + (sessions.length + 1), created: Date.now(), messages: [] };
  sessions.unshift(session);
  saveSessions();
  setActiveSession(id);
  renderSessions();
}

function setActiveSession(id) {
  activeSession = sessions.find(s => s.id === id);
  renderMessages();
  renderSessions();
}

function renderSessions() {
  const el = document.getElementById('session-list');
  if (!sessions.length) { el.innerHTML = '<div class="memory-empty">no sessions yet</div>'; return; }
  el.innerHTML = sessions.map(s => `
    <div class="session-item ${activeSession?.id === s.id ? 'active' : ''}" onclick="setActiveSession('${s.id}')">
      <div>${escHtml(s.label)}</div>
      <div class="session-date">${new Date(s.created).toLocaleDateString()}</div>
    </div>`).join('');
}

function saveSessions() {
  localStorage.setItem('gh-agent-sessions', JSON.stringify(sessions));
}

// Health
async function checkHealth() {
  try {
    const r = await fetch(`${API}/health`);
    const d = await r.json();
    const dot = document.getElementById('status-dot');
    const txt = document.getElementById('status-text');
    if (d.agent_ready) {
      dot.className = 'status-dot ready';
      txt.textContent = 'agent ready';
    } else {
      dot.className = 'status-dot thinking';
      txt.textContent = 'agent loading…';
      setTimeout(checkHealth, 3000);
    }
  } catch {
    document.getElementById('status-text').textContent = 'server offline';
    setTimeout(checkHealth, 5000);
  }
}

// Messages
function renderMessages() {
  const el = document.getElementById('messages');
  if (!activeSession || !activeSession.messages.length) {
    el.innerHTML = `<div class="welcome" id="welcome">
      <div class="welcome-title">GitHub <span>Agent</span></div>
      <div class="welcome-sub">ReAct · MCP tools · Full GitHub access · Memory</div>
      <div class="welcome-chips">
        <span class="chip" onclick="sendChip(this)">List my repos</span>
        <span class="chip" onclick="sendChip(this)">Read README from owner/repo</span>
        <span class="chip" onclick="sendChip(this)">Search code for TODO in my repo</span>
        <span class="chip" onclick="sendChip(this)">Create a branch and commit a file</span>
        <span class="chip" onclick="sendChip(this)">Open a PR from feature to main</span>
        <span class="chip" onclick="sendChip(this)">List open issues and summarise them</span>
      </div>
    </div>`;
    return;
  }
  el.innerHTML = activeSession.messages.map(m => renderMsg(m.role, m.content)).join('');
  scrollToBottom();
}

function renderMsg(role, content) {
  const label = role === 'user' ? 'you' : 'agent';
  return `<div class="msg ${role}"><div class="msg-label">${label}</div><div class="msg-bubble">${formatContent(content)}</div></div>`;
}

// Markdown renderer
function formatContent(text) {
  let s = escHtml(text);

  // Tool trace lines -> collapsible blocks
  s = s.replace(
    /⚙️ \*Using tool: `(.*?)`\*\n([\s\S]*?)✅ \*`\1` done\*\n?/g,
    (_, name, body) => buildTrace(name, body.trim(), true)
  );
  s = s.replace(/⚙️ \*Using tool: `(.*?)`\*/g, (_, name) => buildTrace(name, '', false));
  s = s.replace(/✅ \*`(.*?)` done\*/g, '');

  // Fenced code blocks
  s = s.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const cls = lang ? ` class="language-${lang}"` : '';
    return `<pre><code${cls}>${code.trimEnd()}</code></pre>`;
  });

  // Inline code
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');

  // Bold / italic
  s = s.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
  s = s.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*(.*?)\*/g, '<em>$1</em>');

  // Headings
  s = s.replace(/^### (.+)$/gm, '<h4>$1</h4>');
  s = s.replace(/^## (.+)$/gm, '<h3>$1</h3>');
  s = s.replace(/^# (.+)$/gm, '<h2>$1</h2>');

  // Lists
  s = s.replace(/^[-•] (.+)$/gm, '<li>$1</li>');
  s = s.replace(/(<li>.*<\/li>(\n|$))+/g, m => `<ul>${m}</ul>`);

  // HR
  s = s.replace(/^---+$/gm, '<hr>');

  // Newlines outside pre blocks
  const parts = s.split(/(<pre>[\s\S]*?<\/pre>)/g);
  s = parts.map((p, i) => i % 2 === 1 ? p : p.replace(/\n/g, '<br>')).join('');

  return s;
}

// Collapsible trace block
let _traceId = 0;
function buildTrace(name, body, done) {
  const id = 'trace-' + (++_traceId);
  const statusCls = done ? 'done' : '';
  const statusText = done ? '✓ done' : 'running…';
  const bodyHtml = body ? `<div class="trace-body">${escHtml(body)}</div>` : '<div class="trace-body"><em>no output</em></div>';
  return `<div class="trace-block" id="${id}">
    <div class="trace-header" onclick="toggleTrace('${id}')">
      <span class="trace-icon">⚙</span>
      <span class="trace-name">${escHtml(name)}</span>
      <span class="trace-status ${statusCls}">${statusText}</span>
      <span class="trace-chevron">▶</span>
    </div>
    ${bodyHtml}
  </div>`;
}

function toggleTrace(id) {
  document.getElementById(id)?.classList.toggle('open');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function scrollToBottom() {
  const el = document.getElementById('messages');
  requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
}

// Send message
async function sendMessage() {
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text) return;
  if (!activeSession) newSession();

  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  activeSession.messages.push({ role: 'user', content: text });
  input.value = '';
  autoResize(input);
  renderMessages();
  setThinking(true);

  const assistantMsg = { role: 'assistant', content: '' };
  activeSession.messages.push(assistantMsg);
  renderMessages();
  const bubbles = document.querySelectorAll('.msg.assistant .msg-bubble');
  const activeBubble = bubbles[bubbles.length - 1];
  activeBubble.classList.add('cursor');

  const activeRepo = document.getElementById('active-repo').value.trim() || null;
  const activeBranch = document.getElementById('active-branch').value.trim() || null;

  const headers = { 'Content-Type': 'application/json' };
  if (authToken) headers['Authorization'] = `Bearer ${authToken}`;

  try {
    const sessionId = activeSession.id;
    const resp = await fetch(`${API}/chat/stream`, {
      method: 'POST',
      headers,
      body: JSON.stringify({
        message: text,
        session_id: sessionId,
        active_repo: activeRepo,
        active_branch: activeBranch,
      }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      
      const rawMessages = buffer.split(/\r?\n\r?\n/);

      buffer = rawMessages.pop() || '';

      for (const msg of rawMessages) {
          if (!msg.trim()) continue;

          let eventType = '';
          let eventData = '';

          for (const line of msg.split(/\r?\n/)) {
              if (line.startsWith('event:')) {
                  eventType = line.substring(6).trim();
              }

              if (line.startsWith('data:')) {
                  eventData += line.substring(5).trim();
              }
          }

          console.log('PARSED:', eventType, eventData);

          if (eventType === 'token') {
              assistantMsg.content += eventData;
              activeBubble.innerHTML = formatContent(
                  assistantMsg.content
              );
          }

          if (eventType === 'done') {
              console.log('STREAM COMPLETE');
          }
      }
    }
  } catch (e) {
    assistantMsg.content = `Error: ${e.message}`;
    activeBubble.innerHTML = formatContent(assistantMsg.content);
  }

  activeBubble.classList.remove('cursor');
  setThinking(false);
  saveSessions();
  setTimeout(loadMemories, 1000);
}

function sendChip(el) {
  document.getElementById('user-input').value = el.textContent;
  sendMessage();
}

function setThinking(yes) {
  document.getElementById('send-btn').disabled = yes;
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  if (yes) {
    dot.className = 'status-dot thinking';
    txt.textContent = 'thinking…';
  } else {
    dot.className = 'status-dot ready';
    txt.textContent = 'agent ready';
  }
}

// Memory
async function loadMemories() {
  try {
    const headers = {};
    if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
    const r = await fetch(`${API}/memories`, { headers });
    const d = await r.json();
    const el = document.getElementById('memory-list');
    if (!d.memories || !d.memories.length) {
      el.innerHTML = '<div class="memory-empty">no memories yet</div>';
    } else {
      el.innerHTML = d.memories.map(m => `<div class="memory-item">${escHtml(m)}</div>`).join('');
    }
  } catch {}
}

async function clearMemory() {
  if (!confirm('Delete all long-term memories?')) return;
  const headers = {};
  if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
  await fetch(`${API}/memories`, { method: 'DELETE', headers });
  loadMemories();
}

// Input helpers
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}
</script>
