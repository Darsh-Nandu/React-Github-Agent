name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run tests
        env:
          # Dummy values so imports don't fail
          GITHUB_TOKEN: ghp_test_token_ci
          GROQ_API_KEY: gsk_test_key_ci
          OPENAI_API_KEY: sk-test-ci
        run: |
          pytest tests/ \
            --cov=agent \
            --cov=github_tools \
            --cov=mcp_server \
            --cov-report=term-missing \
            --cov-report=xml \
            -v \
            --tb=short

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: |
          pip install black pylint

      - name: Check formatting (black)
        run: |
          black --check --diff .

      - name: Lint (pylint)
        run: |
          pylint agent/ github_tools/ mcp_server/ main.py \
            --disable=C0114,C0115,C0116,R0903,W0611 \
            --fail-under=7.0
        continue-on-error: true   # advisory only — won't block merges

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit security scan
        run: |
          bandit -r agent/ github_tools/ mcp_server/ main.py \
            -ll \
            --skip B101,B603 \
            -f txt
        continue-on-error: true   # advisory only