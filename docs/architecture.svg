<rect x="62"  y="87" width="118" height="54" rx="8" class="i-teal" stroke-width="0.5"/>
<text class="th" x="121" y="110" text-anchor="middle">Auth screen</text>
<text class="ts" x="121" y="127" text-anchor="middle">Register / Login</text>
