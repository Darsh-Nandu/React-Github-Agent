<svg width="100%" viewBox="0 0 680 920" role="img" xmlns="http://www.w3.org/2000/svg">
<title>ReAct GitHub Agent System Architecture</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: ui-monospace, 'JetBrains Mono', monospace; fill: #e2e8f0; }
    .th { font-size: 13px; font-weight: 600; fill: #f1f5f9; }
    .ts { font-size: 11px; fill: #94a3b8; }
    .t-teal   { fill:#0d3a2e; stroke:#10b981; }
    .t-purple { fill:#1e1435; stroke:#8b5cf6; }
    .t-gray   { fill:#1a1f2e; stroke:#475569; }
    .t-amber  { fill:#2a1f0a; stroke:#f59e0b; }
    .t-coral  { fill:#2a1410; stroke:#f97316; }
    .t-blue   { fill:#0d1f35; stroke:#3b82f6; }
    .i-teal   { fill:#0a4a38; stroke:#059669; }
    .i-purple { fill:#2d1f50; stroke:#7c3aed; }
    .i-gray   { fill:#242938; stroke:#334155; }
    .i-coral  { fill:#3a1a10; stroke:#ea580c; }
    .i-blue   { fill:#0d2a45; stroke:#2563eb; }
    .arr      { stroke:#475569; stroke-width:1; fill:none; }
  </style>
</defs>

<rect x="40" y="30" width="600" height="130" rx="14" class="t-teal" stroke-width="0.5"/>
