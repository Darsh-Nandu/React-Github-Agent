<text class="th" x="255" y="110" text-anchor="middle">Chat UI</text>
<text class="ts" x="255" y="127" text-anchor="middle">Traces · Markdown</text>
<rect x="330" y="87" width="118" height="54" rx="8" class="i-teal" stroke-width="0.5"/>
