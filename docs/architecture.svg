<text class="ts" x="340" y="399" text-anchor="middle">Think  ──▶  Act  ──▶  Observe  (streams live)</text>
<rect x="220" y="413" width="240" height="52" rx="8" class="t-amber" stroke-width="0.5"/>
<text class="th" x="340" y="435" text-anchor="middle">Groq  ·  llama-3.3-70b</text>
<text class="ts" x="340" y="452" text-anchor="middle">Reasoning + tool selection</text>
<rect x="58"  y="483" width="220" height="88" rx="8" class="i-gray" stroke-width="0.5"/>
<text class="th" x="168" y="505" text-anchor="middle">Short-term memory</text>
<text class="ts" x="168" y="522" text-anchor="middle">SqliteSaver</text>
<text class="ts" x="168" y="538" text-anchor="middle">Per-session · persists restarts</text>
<text class="ts" x="168" y="554" text-anchor="middle">Full message history</text>
<rect x="402" y="483" width="220" height="88" rx="8" class="i-gray" stroke-width="0.5"/>
<text class="th" x="512" y="505" text-anchor="middle">Long-term memory</text>
<text class="ts" x="512" y="522" text-anchor="middle">Mem0</text>
<text class="ts" x="512" y="538" text-anchor="middle">Cross-session · per-user</text>
<text class="ts" x="512" y="554" text-anchor="middle">Dedup + decay pruning</text>
<line x1="278" y1="528" x2="402" y2="528" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4" fill="none"/>
